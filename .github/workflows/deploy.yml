name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'
          cache-dependency-path: './code_files(2)/package-lock.json'

      - name: Install Dependencies
        working-directory: ./code_files(2)
        run: npm ci

      - name: Code Lint and Checks
        working-directory: ./code_files(2)
        run: npm run lint

      - name: Build Project
        working-directory: ./code_files(2)
        run: npm run build

      - name: Check Build Artifacts
        working-directory: ./code_files(2)
        run: node scripts/check-build.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './code_files(2)/dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4