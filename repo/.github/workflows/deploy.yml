name: Deploy

on:
  push:
    branches:
      - main
      - release/pages
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    outputs:
      project_dir: ${{ steps.detect.outputs.project_dir }}
      base_path: ${{ steps.base.outputs.base_path }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect project directory
        id: detect
        shell: bash
        run: |
          if [ -f "code_files(2)/package.json" ] && [ -f "code_files(2)/package-lock.json" ]; then
            echo "project_dir=code_files(2)" >> "$GITHUB_OUTPUT"
          elif [ -f "package.json" ] && [ -f "package-lock.json" ]; then
            echo "project_dir=." >> "$GITHUB_OUTPUT"
          else
            echo "package.json 或 package-lock.json 未找到，无法确定构建目录" >&2
            exit 1
          fi

      - name: Resolve GitHub Pages base path
        id: base
        shell: bash
        run: echo "base_path=/${GITHUB_REPOSITORY#*/}/" >> "$GITHUB_OUTPUT"

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: actions/configure-pages@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ steps.detect.outputs.project_dir }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.detect.outputs.project_dir }}
        run: npm ci

      - name: Run CI quality gate
        working-directory: ${{ steps.detect.outputs.project_dir }}
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.base_path }}
          EXPECTED_BASE_PATH: ${{ steps.base.outputs.base_path }}
        run: npm run ci:quality

      - name: Upload downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: canvas-defender-dist-${{ github.sha }}
          path: ${{ steps.detect.outputs.project_dir }}/dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload GitHub Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.detect.outputs.project_dir }}/dist

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: quality-gate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
